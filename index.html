  /* 1. ACTIVATION OVERLAY */
  #activate-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .activate-btn {
    padding: 20px 35px;
    background: #00ff66;
    color: #000;
    font-weight: bold;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    box-shadow: 0 0 25px #00ff66;
    animation: pulse 1.5s infinite;
    cursor: pointer;
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 10px #00ff66; }
    50% { transform: scale(1.05); box-shadow: 0 0 30px #00ff66; }
    100% { transform: scale(1); box-shadow: 0 0 10px #00ff66; }
  }

  /* 2. TERMINAL */
  #terminal-container {
    width: 100%;
    max-width: 600px;
    display: none;
  }
  #terminal {
    font-size: 15px;
    line-height: 1.6;
    text-align: left;
    margin-bottom: 20px;
  }
  .red { color: #ff0044; }
  .white { color: #fff; }

  /* 3. GIFT BOX */
  .gift-box {
    display: none;
    max-width: 500px;
    width: 100%;
    border: 2px solid #00ff66;
    padding: 25px;
    background: rgba(0, 255, 102, 0.05);
    box-shadow: 0 0 30px rgba(0,255,102,0.4);
    border-radius: 12px;
    animation: popup 0.6s ease-out;
    box-sizing: border-box;
  }
  
  .gift-heading {
    font-size: 26px;
    color: #ffeb3b;
    margin: 0 0 10px 0;
    text-shadow: 0 0 10px #ffeb3b;
  }

  .main-message {
    font-size: 16px;
    color: #fff;
    margin: 15px 0;
    line-height: 1.5;
  }

  .btn-reveal {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 28px;
    background: transparent;
    color: #00ff66;
    font-weight: bold;
    font-size: 16px;
    border: 2px solid #00ff66;
    border-radius: 6px;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-reveal:hover {
    background: #00ff66;
    color: #000;
    box-shadow: 0 0 20px #00ff66;
  }

  /* 4. HIDDEN IMAGE CONTAINER */
  #gift-image-container {
    display: none;
    margin-top: 25px;
    animation: fadeIn 0.8s ease;
  }
  #gift-image {
    max-width: 100%;
    max-height: 50vh;
    border: 3px solid #00ff66;
    box-shadow: 0 0 25px rgba(0,255,102,0.5);
    border-radius: 8px;
    object-fit: contain;
  }

  @keyframes popup {
    from { transform: scale(0.6) translateY(50px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>

<script>
  const overlay = document.getElementById('activate-overlay');
  const termContainer = document.getElementById('terminal-container');
  const terminal = document.getElementById('terminal');
  const gift = document.getElementById('gift');
  const hackerBeep = document.getElementById('hacker-beep');
  const bgMusic = document.getElementById('bg-music');

  const logs = [
    "INITIALIZING REMOTE CONNECTION...",
    "SECURE SHELL ESTABLISHED... SUCCESS",
    "TARGET NODE: <span class='white'>[Menoo's Device]</span> CONNECTED",
    "<span class='red'>[CRITICAL WARNING] BYPASSING FIREWALL...</span>",
    "DECRYPTING PRIVATE PAYLOAD...",
    "EXTRACTING CELEBRATION DATA...",
    "<span style='color:#fff'>ALL DEFENSES OVERRIDDEN. SYSTEM COMPROMISED!</span>"
  ];

  let index = 0;

  function startSurprise() {
    overlay.style.display = 'none';
    termContainer.style.display = 'block';

    hackerBeep.volume = 0.25;
    bgMusic.volume = 0.65;

    hackerBeep.play().catch(e => console.log(e));
    bgMusic.play().catch(e => console.log(e));

    printLogs();
  }

  function printLogs() {
    if (index < logs.length) {
      terminal.innerHTML += "> " + logs[index] + "<br>";
      index++;
      let delay = Math.floor(Math.random() * (750 - 450 + 1)) + 450;
      setTimeout(printLogs, delay);
    } else {
      setTimeout(() => {
        hackerBeep.pause();
        termContainer.style.display = 'none';
        gift.style.display = 'block';
      }, 900);
    }
  }

  function revealImage() {
    const btn = document.querySelector('.btn-reveal');
    const imgContainer = document.getElementById('gift-image-container');
    
    btn.style.display = 'none';
    imgContainer.style.display = 'block';
  }
