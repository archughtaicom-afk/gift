<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMD SYSTEM BREACH</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: #000;
    color: #00ff66;
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* 1. INITIAL ACTIVATION OVERLAY */
  #activate-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .activate-btn {
    padding: 20px 35px;
    background: #00ff66;
    color: #000;
    font-weight: bold;
    font-size: 18px;
    border: none;
    border-radius: 6px;
    box-shadow: 0 0 25px #00ff66;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
  }

  /* 2. CMD TERMINAL MATRIX SCREEN */
  #cmd-screen {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    padding: 15px;
    font-size: 13px;
    line-height: 1.3;
    overflow: hidden;
    color: #00ff66;
    background: #000;
    white-space: pre-wrap;
    word-break: break-all;
    z-index: 100;
  }

  /* 3. STEP-BY-STEP SCREENS */
  .display-box {
    display: none;
    text-align: center;
    padding: 25px;
    z-index: 50;
    max-width: 600px;
    width: 90%;
  }

  .huge-title {
    font-size: clamp(26px, 6vw, 42px);
    color: #00ff66;
    text-shadow: 0 0 20px #00ff66;
    font-weight: 900;
    letter-spacing: 2px;
  }

  .tagline-text {
    font-size: clamp(18px, 4vw, 24px);
    color: #fff;
    line-height: 1.5;
    text-shadow: 0 0 10px rgba(255,255,255,0.6);
  }

  /* 4. BUTTON & PICTURE */
  .btn-check-pic {
    padding: 15px 30px;
    background: transparent;
    color: #00ff66;
    font-weight: bold;
    font-size: 18px;
    border: 2px solid #00ff66;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,255,102,0.4);
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    transition: 0.3s;
  }
  .btn-check-pic:hover {
    background: #00ff66;
    color: #000;
  }

  #gift-image-container {
    display: none;
    margin-top: 20px;
    animation: fadeIn 0.8s ease;
  }
  #gift-image {
    max-width: 100%;
    max-height: 60vh;
    border: 3px solid #00ff66;
    box-shadow: 0 0 25px rgba(0,255,102,0.6);
    border-radius: 8px;
    object-fit: contain;
  }

  /* 5. BALLOONS ANIMATION */
  .balloon {
    position: fixed;
    bottom: -100px;
    width: 40px;
    height: 55px;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    z-index: 10;
    animation: floatUp 5s linear infinite;
  }
  .balloon::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: 18px;
    width: 2px;
    height: 15px;
    background: #aaa;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
